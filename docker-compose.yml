services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: paycore
      POSTGRES_USER: paycore
      POSTGRES_PASSWORD: paycore
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paycore -d paycore"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/paycore
      DB_USER: paycore
      DB_PASSWORD: paycore
      REDIS_HOST: redis
      ADMIN_KEY: dev-admin-key
      # dev-only webhook settings: allow localhost targets, and fail fast so the dead-letter test is quick
      WEBHOOK_ALLOW_PRIVATE: "true"
      WEBHOOK_MAX_ATTEMPTS: "5"
      WEBHOOK_BASE_DELAY_SECONDS: "1"
      ESCROW_SHARDS: "16"       # 1 = single escrow account (baseline), up to 16 = sharded
      # --- LOAD TEST ONLY: remove the two leading "#" so per-key rate limiting doesn't throttle k6,
      # then run `docker compose up -d app`. Put the "#" back afterwards (concurrency_test.py check 10 needs the limiter).
      # RATE_LIMIT_CAPACITY: "1000000"
      # RATE_LIMIT_REFILL: "1000000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports: ["8080:8080"]

  # Load generator. Not started by default; run with:  docker compose --profile loadtest run --rm k6
  k6:
    image: grafana/k6:0.52.0
    profiles: ["loadtest"]
    user: "0"
    depends_on:
      - app
    volumes:
      - ./loadtest:/loadtest
    environment:
      BASE_URL: http://app:8080
      ADMIN_KEY: dev-admin-key
    command: ["run", "/loadtest/payment_flow.js"]
