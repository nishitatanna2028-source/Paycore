services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: paycore
      POSTGRES_USER: paycore
      POSTGRES_PASSWORD: paycore
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paycore -d paycore"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/paycore
      DB_USER: paycore
      DB_PASSWORD: paycore
    ports: ["8080:8080"]
