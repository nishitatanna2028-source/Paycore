services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: paycore
      POSTGRES_USER: paycore
      POSTGRES_PASSWORD: paycore
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paycore -d paycore"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/paycore
      DB_USER: paycore
      DB_PASSWORD: paycore
      REDIS_HOST: redis
      ADMIN_KEY: dev-admin-key
      # dev-only webhook settings: allow localhost targets, and fail fast so the dead-letter test is quick
      WEBHOOK_ALLOW_PRIVATE: "true"
      WEBHOOK_MAX_ATTEMPTS: "5"
      WEBHOOK_BASE_DELAY_SECONDS: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports: ["8080:8080"]
