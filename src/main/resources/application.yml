spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/paycore}
    username: ${DB_USER:paycore}
    password: ${DB_PASSWORD:paycore}
    hikari:
      maximum-pool-size: 30
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      timeout: 500ms
      connect-timeout: 500ms
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true

paycore:
  admin-key: ${ADMIN_KEY:dev-admin-key}
  escrow-shards: ${ESCROW_SHARDS:16}    # 1 = single escrow account, up to 16 = spread lock contention
  rate-limit:
    capacity: ${RATE_LIMIT_CAPACITY:100}          # max burst
    refill-per-second: ${RATE_LIMIT_REFILL:50}    # sustained requests/sec per API key
  fraud:
    enabled: ${FRAUD_ENABLED:true}
    velocity-max-per-minute: ${FRAUD_VELOCITY_MAX:60}   # per customer; above this = declined
    review-amount: ${FRAUD_REVIEW_AMOUNT:10000000}       # minor units (INR 100,000); at or above = held for review
  webhooks:
    allow-private-targets: ${WEBHOOK_ALLOW_PRIVATE:false}   # SSRF guard; only enable for local testing
    max-attempts: ${WEBHOOK_MAX_ATTEMPTS:8}
    base-delay-seconds: ${WEBHOOK_BASE_DELAY_SECONDS:2}     # retry delay doubles each attempt
    max-delay-seconds: 3600
    lease-seconds: 60                                       # a claimed event not finished in this time is retried
    batch-size: 20
    poll-interval-ms: 1000

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: paycore
    distribution:
      percentiles-histogram:
        http.server.requests: true      # latency buckets, so Prometheus can compute p95/p99
