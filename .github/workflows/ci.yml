name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # The runner has Docker, so Testcontainers starts real PostgreSQL and Redis containers.
      - name: Compile, run integration tests, package
        run: mvn -B verify
